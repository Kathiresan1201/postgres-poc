---
postgresql_version: "16"
postgresql_cluster_name: main
postgresql_service_name: postgresql
postgresql_port: 5432
postgresql_listen_addresses: "127.0.0.1"
postgresql_config_directory: "/etc/postgresql/{{ postgresql_version }}/{{ postgresql_cluster_name }}"
postgresql_data_directory: "/var/lib/postgresql/{{ postgresql_version }}/{{ postgresql_cluster_name }}"
postgresql_config_file: "{{ postgresql_config_directory }}/postgresql.conf"
postgresql_hba_file: "{{ postgresql_config_directory }}/pg_hba.conf"
postgresql_packages:
  - "postgresql-{{ postgresql_version }}"
  - "postgresql-client-{{ postgresql_version }}"
  - "postgresql-contrib-{{ postgresql_version }}"
  - "postgresql-server-dev-{{ postgresql_version }}"
  - python3-psycopg2
postgresql_prerequisite_packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - locales
  - postgresql-common
  - python3
  - python3-apt
  - python3-psycopg2
  - ufw
postgresql_allowed_networks: []
postgresql_app_database: application_db
postgresql_app_user: application_user
postgresql_encoding: UTF8
postgresql_locale: en_US.UTF-8
postgresql_max_connections: 200
postgresql_shared_buffers: 1GB
postgresql_effective_cache_size: 3GB
postgresql_maintenance_work_mem: 256MB
postgresql_work_mem: 8MB
postgresql_wal_buffers: 16MB
postgresql_min_wal_size: 1GB
postgresql_max_wal_size: 4GB
postgresql_checkpoint_completion_target: 0.9
postgresql_random_page_cost: 1.1
postgresql_effective_io_concurrency: 200
postgresql_log_directory: log
postgresql_log_filename: "postgresql-%Y-%m-%d_%H%M%S.log"
postgresql_log_rotation_age: 1d
postgresql_log_truncate_on_rotation: "on"
postgresql_log_connections: "on"
postgresql_log_disconnections: "on"
postgresql_log_checkpoints: "on"
postgresql_log_lock_waits: "on"
postgresql_log_temp_files: 0
postgresql_log_min_duration_statement: 1000
postgresql_configure_ufw: false
postgresql_enable_ufw: false
postgresql_manage_admin_password: true
postgresql_create_app_user: true
postgresql_create_app_database: true
