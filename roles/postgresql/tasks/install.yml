---
# Ubuntu's postgresql-common creates a "main" cluster on package install using
# the ambient locale, which would make the pg_createcluster task below a no-op.
- name: Disable automatic cluster creation on package install
  ansible.builtin.lineinfile:
    path: /etc/postgresql-common/createcluster.conf
    regexp: '^\s*#?\s*create_main_cluster\s*='
    line: create_main_cluster = false
    owner: root
    group: root
    mode: "0644"

- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name: "{{ postgresql_packages }}"
    state: present
  notify: Restart PostgreSQL

- name: Create PostgreSQL cluster when missing
  ansible.builtin.command:
    cmd: >-
      pg_createcluster {{ postgresql_version }} {{ postgresql_cluster_name }}
      --start --locale={{ postgresql_locale }} --encoding={{ postgresql_encoding }}
  args:
    creates: "{{ postgresql_data_directory }}/PG_VERSION"

- name: Ensure PostgreSQL data directory ownership
  ansible.builtin.file:
    path: "{{ postgresql_data_directory }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Enable and start PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
