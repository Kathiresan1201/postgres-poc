---
# Step 2 of the Morpheus "PostgreSQL on vSphere" catalog item (POC).
# Morpheus runs this against the VM it just provisioned. Native Morpheus
# Ansible passes the catalog inputs as morpheus.customOptions (top-level
# customOptions is empty). See morpheus/README.md.
- name: Install PostgreSQL on a Morpheus-provisioned VM
  hosts: all
  become: true
  gather_facts: true

  vars:
    morpheus_options: "{{ (customOptions | default({})) | combine((morpheus | default({})).customOptions | default({})) }}"

    postgresql_app_database: "{{ morpheus_options.pgAppDatabase }}"
    postgresql_app_user: "{{ morpheus_options.pgAppUser }}"
    postgresql_app_password: "{{ morpheus_options.pgAppPassword }}"
    # POC: app user may connect from any IPv4 network (password auth, app DB only).
    # Narrow this to the application subnet before any non-POC use.
    postgresql_allowed_networks: ["0.0.0.0/0"]
    postgresql_listen_addresses: "0.0.0.0"

    # POC: postgres superuser stays local peer-auth only, no firewall changes.
    postgresql_manage_admin_password: false
    postgresql_configure_ufw: false

    # POC sizing: smallest catalog plan is 1 vCPU / 4 GB. Role defaults
    # (shared_buffers 1GB, effective_cache_size 3GB) fit; cap connections.
    postgresql_max_connections: 100

    # Server only; skip postgresql-server-dev (build toolchain) on POC VMs.
    postgresql_packages:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-client-{{ postgresql_version }}"
      - "postgresql-contrib-{{ postgresql_version }}"
      - python3-psycopg2

  roles:
    - postgresql
