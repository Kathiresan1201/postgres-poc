---
# Step 2 of the Morpheus "PostgreSQL on vSphere" catalog item (POC).
# Morpheus runs this against the VM it just provisioned. Native Morpheus
# Ansible passes the catalog inputs as morpheus.customOptions (top-level
# customOptions is empty). See morpheus/README.md.
- name: Install PostgreSQL on a Morpheus-provisioned VM
  hosts: all
  become: true
  gather_facts: true

  vars:
    # POC VMs are rebuilt on the same IP (template 315 hardcodes it), so their
    # SSH host keys legitimately change between orders. Don't pin them.
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    morpheus_options: "{{ (customOptions | default({})) | combine((morpheus | default({})).customOptions | default({})) }}"

    postgresql_app_database: "{{ morpheus_options.pgAppDatabase }}"
    postgresql_app_user: "{{ morpheus_options.pgAppUser }}"
    postgresql_app_password: "{{ morpheus_options.pgAppPassword }}"
    # POC: app user may connect from any IPv4 network (password auth, app DB only).
    # Narrow this to the application subnet before any non-POC use.
    postgresql_allowed_networks: ["0.0.0.0/0"]
    postgresql_listen_addresses: "0.0.0.0"

    # POC: postgres superuser stays local peer-auth only, no firewall changes.
    postgresql_manage_admin_password: false
    postgresql_configure_ufw: false

    # POC sizing: smallest catalog plan is 1 vCPU / 4 GB. Role defaults
    # (shared_buffers 1GB, effective_cache_size 3GB) fit; cap connections.
    postgresql_max_connections: 100

    # Server only; skip postgresql-server-dev (build toolchain) on POC VMs.
    postgresql_packages:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-client-{{ postgresql_version }}"
      - "postgresql-contrib-{{ postgresql_version }}"
      - python3-psycopg2

  pre_tasks:
    # The catalog's disk size (pocDiskSize) resizes the VM disk, but templates
    # that ignore cloud-init never grow the filesystem into the new space.
    - name: Ensure growpart is available
      ansible.builtin.apt:
        name: cloud-guest-utils
        state: present

    - name: Grow root partition, LVM and filesystem to fill the disk
      ansible.builtin.shell: |
        set -euo pipefail
        src=$(findmnt -no SOURCE /)
        fstype=$(findmnt -no FSTYPE /)
        vg=""
        if lvs "$src" >/dev/null 2>&1; then
          vg=$(lvs --noheadings -o vg_name "$src" | tr -d ' ')
          pv=$(pvs --noheadings -o pv_name -S vg_name="$vg" | head -1 | tr -d ' ')
        else
          pv=$src
        fi
        disk=/dev/$(lsblk -no PKNAME "$pv" | head -1)
        part=$(cat "/sys/class/block/$(basename "$(readlink -f "$pv")")/partition")
        changed=no
        out=$(growpart "$disk" "$part" 2>&1) || true
        case "$out" in *CHANGED*) changed=yes ;; esac
        if [ -n "$vg" ]; then
          pvresize "$pv" >/dev/null
          if [ "$(vgs --noheadings --units b --nosuffix -o vg_free "$vg" | tr -d ' ')" -gt 0 ]; then
            lvextend -r -l +100%FREE "$src" >/dev/null
            changed=yes
          fi
        elif [ "$changed" = yes ]; then
          case "$fstype" in
            xfs) xfs_growfs / >/dev/null ;;
            *) resize2fs "$src" >/dev/null ;;
          esac
        fi
        echo "changed=$changed"
        df -h / | tail -1
      args:
        executable: /bin/bash
      register: postgresql_grow_root
      changed_when: "'changed=yes' in postgresql_grow_root.stdout"

    - name: Show root filesystem size
      ansible.builtin.debug:
        msg: "{{ postgresql_grow_root.stdout_lines | last }}"

  roles:
    - postgresql
