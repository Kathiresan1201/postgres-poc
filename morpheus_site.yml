---
# Step 2 of the Morpheus "PostgreSQL on vSphere" catalog item (POC).
# Morpheus runs this against the VM it just provisioned and passes the
# catalog inputs as customOptions. See morpheus/README.md.
- name: Install PostgreSQL on a Morpheus-provisioned VM
  hosts: all
  become: true
  gather_facts: true

  vars:
    postgresql_app_database: "{{ customOptions.pgAppDatabase }}"
    postgresql_app_user: "{{ customOptions.pgAppUser }}"
    postgresql_app_password: "{{ customOptions.pgAppPassword }}"
    # POC: app user may connect from any IPv4 network (password auth, app DB only).
    # Narrow this to the application subnet before any non-POC use.
    postgresql_allowed_networks: ["0.0.0.0/0"]
    postgresql_listen_addresses: "0.0.0.0"

    # POC: postgres superuser stays local peer-auth only, no firewall changes.
    postgresql_manage_admin_password: false
    postgresql_configure_ufw: false

    # POC sizing: smallest catalog plan is 1 vCPU / 4 GB. Role defaults
    # (shared_buffers 1GB, effective_cache_size 3GB) fit; cap connections.
    postgresql_max_connections: 100

    # Server only; skip postgresql-server-dev (build toolchain) on POC VMs.
    postgresql_packages:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-client-{{ postgresql_version }}"
      - "postgresql-contrib-{{ postgresql_version }}"
      - python3-psycopg2

  pre_tasks:
    # TEMP (POC debugging): show which variable names Morpheus passes, never values.
    - name: Show Morpheus-provided variable names
      ansible.builtin.debug:
        msg:
          top_level: "{{ hostvars[inventory_hostname].keys() | reject('match', '^ansible_') | list | sort }}"
          customOptions_keys: "{{ (customOptions | default({})).keys() | list }}"
          instance_keys: "{{ (instance | default({})).keys() | list if instance is mapping else 'n/a' }}"
          instance_config_customOptions_keys: "{{ ((instance | default({})).config | default({})).customOptions | default({}) | list if instance is mapping else 'n/a' }}"
          morpheus_keys: "{{ (morpheus | default({})).keys() | list if morpheus is mapping else 'n/a' }}"

  roles:
    - postgresql
